<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fix for 'ethereum' redefinition error caused by some browser extensions -->
    <script>
      (function() {
        if (window.ethereum) return;
        let ethereum;
        Object.defineProperty(window, 'ethereum', {
          get() { return ethereum; },
          set(v) { ethereum = v; },
          configurable: true
        });
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>BitBrainTech | 100% Private AI Media & PDF Tools</title>
    <meta name="title" content="BitBrainTech | 100% Private AI Media & PDF Tools" />
    <meta name="description" content="Free professional media suite: AI Background Remover, Video Metadata Editor, PDF Tools, and OCR. 100% private, browser-based processing with no server uploads." />
    <meta name="keywords" content="BitBrainTech, free background remover, video uniqueifier, metadata editor, bypass youtube copyright, private ocr, image upscaler, pdf merger online" />
    <meta name="author" content="BitBrainTech" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->

      }
    </script>
